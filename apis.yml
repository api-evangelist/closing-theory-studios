name: Closing Theory Studios
description: >-
  Closing Theory Studios, Inc. is an independent mobile game studio founded in
  2023 and based in Austin, Texas, on a mission to bring the real world into
  games. Its debut title, Househunt (the officially licensed ZillowGoneWild
  game), lets the 70 million-plus people who browse Zillow for fun buy, guess
  prices on, renovate, flip, and manage real houses in a casual mobile
  experience aimed at "non-gamers." The studio was co-founded by Ankith Harathi
  and Nitin Rajinikanth and raised a $2.3M round led by a16z GAMES SPEEDRUN,
  with participation from Powerhouse Capital and angel Seth Sivak (founder of
  Proletariat, acquired by Blizzard). Closing Theory Studios ships consumer
  mobile games on iOS and Android and does not currently publish a public
  developer API, SDK, or API documentation surface.
